<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BF Digital Exchange - Câmbios Seguros</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #fff; display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; padding: 20px; }
        .container { max-width: 650px; width: 100%; background: #1e293b; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 30px; }
        .calc-box { background: #0f172a; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #334155; text-align: left; }
        .calc-box label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
        .calc-box input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; font-size: 16px; margin-bottom: 15px; }
        .calc-result { font-size: 18px; color: #38bdf8; font-weight: bold; text-align: center; }
        .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-secondary { background: #334155; color: #f8fafc; border: 1px solid #475569; }
        .btn-secondary:hover { background: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BF Digital Exchange</h1>
        <p>A sua plataforma profissional de câmbio rápido, seguro e automatizado.</p>
        
        <div class="calc-box">
            <label>Valor em Euros (€)</label>
            <input type="number" id="eurInput" value="100" oninput="calcular()">
            <div class="calc-result">Vai receber aprox.: <span id="kzResult">95000</span> KZ</div>
        </div>

        <div class="btn-group">
            <a href="/signup" class="btn btn-primary">Registar Conta</a>
            <a href="/client-login" class="btn btn-secondary">Entrar na Sala</a>
            <a href="/login" class="btn btn-secondary" style="border-color:#38bdf8; color:#38bdf8;">Painel Admin</a>
        </div>
    </div>

    <script>
        function calcular() {
            let eur = document.getElementById('eurInput').value;
            let taxa = 950;
            let total = eur * taxa;
            document.getElementById('kzResult').innerText = total.toLocaleString();
        }
    </script>
</body>
</html>
